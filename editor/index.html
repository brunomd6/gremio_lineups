<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grêmio Lineup Editor</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      gap: 20px;
    }

    svg {
      background: #1f7a1f;
      border: 2px solid #ccc;
    }

    .player {
      cursor: grab;
    }

    textarea {
      width: 350px;
      height: 600px;
      background: #222;
      color: #0f0;
      font-family: monospace;
    }

    button {
      padding: 10px;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

<svg id="pitch" width="400" height="600" viewBox="0 0 100 150">
  <!-- Pitch lines -->
  <rect x="0" y="0" width="100" height="150" fill="none" stroke="white"/>
  <line x1="0" y1="75" x2="100" y2="75" stroke="white"/>
  <circle cx="50" cy="75" r="9.15" fill="none" stroke="white"/>
</svg>

<div>
  <h3>YAML Output</h3>
  <textarea id="output"></textarea>
  <button onclick="exportYAML()">Export YAML</button>
</div>

<script src="editor.js"></script>
</body>
</html>
