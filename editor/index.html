<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grêmio Lineup Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <aside id="roster">
    <h2>Elenco</h2>
    <div id="rosterList"></div>
  </aside>

  <main id="field">
    <div id="pitch-wrapper">
      <img src="../assets/pitch/pitch.png" id="pitch-img" />

      <svg
        id="pitch"
        viewBox="0 0 100 150"
        preserveAspectRatio="xMidYMid meet"
      ></svg>
    </div>
  </main>
</div>

<script src="editor.js"></script>
</body>
</html>
