<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grêmio Lineup Editor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>Grêmio Lineup Editor — 2026</h1>
  </header>

  <main class="layout">

    <!-- Pitch -->
    <section class="pitch-container">
      <svg id="pitch"
           viewBox="0 0 100 150"
           width="450"
           height="675"
           role="img"
           aria-label="Football pitch">

        <!-- Grass -->
        <rect x="0" y="0" width="100" height="150" fill="#1f7a1f"/>

        <!-- Halfway line -->
        <line x1="0" y1="75" x2="100" y2="75"
              stroke="white" stroke-width="0.5"/>

        <!-- Center circle -->
        <circle cx="50" cy="75" r="9.15"
                stroke="white" stroke-width="0.5" fill="none"/>

        <!-- Center spot -->
        <circle cx="50" cy="75" r="0.5" fill="white"/>

      </svg>
    </section>

    <!-- Controls -->
    <section class="controls">

      <div class="control-group">
        <label for="matchSelect">Match</label>
        <select id="matchSelect"></select>
      </div>

      <div class="control-group">
        <h3>Available players</h3>
        <ul id="rosterList" class="roster"></ul>
      </div>

      <div class="control-group">
        <button id="exportBtn">Export JSON</button>
      </div>

      <div class="control-group">
        <label for="output">Updated season JSON</label>
        <textarea id="output"
                  rows="22"
                  spellcheck="false"
                  placeholder="Click “Export JSON” to see updated data here"></textarea>
      </div>

    </section>

  </main>

  <script src="editor.js"></script>
</body>
</html>
