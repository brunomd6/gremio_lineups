<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grêmio Lineup Editor</title>

  <link rel="icon" type="image/svg+xml" href="../assets/pitch/pitch.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <aside id="sidebar">
      <section id="calendar">
        <h2>Matches</h2>
        <div id="matchList"></div>
        <button id="addMatchBtn">+ Add Match</button>
      </section>

      <section id="roster">
        <h2>Roster</h2>
        <div id="rosterList"></div>
      </section>
    </aside>

    <main id="pitch-container">
      <svg id="pitch" viewBox="0 0 100 150" preserveAspectRatio="xMidYMid meet">
        <image
  href="../assets/pitch/pitch.png"
  x="0"
  y="0"
  width="100"
  height="150"
  pointer-events="none"
/>
      </svg>
    </main>
  </div>

  <script src="editor.js"></script>
</body>
</html>
